<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Grid</title>
    <style>
      /* Add some borders to help get things along */
      body * {
        border: 1px solid blue;
      }

      #container {
        display: grid;
        grid-template-columns: 1fr 1fr;
        width: 70%;
        margin: 0 auto;
      }
      #shade {
        background-color: #b9b8b9;
        grid-column: 2/3;
        grid-row: 1/3;
      }
      h1 {
        grid-column: 1/3;
        grid-row: 1/2;
      }
      h2 {
        grid-column: 2/3;
        grid-row: 2/3;
      }
      img {
        grid-column: 1/2;
        grid-row: 1/3;
      }
    </style>
  </head>
  <body>
    <div id="container">
      <h1>Tart & Sweet</h1>
      <img
        src="w06_cherries.png"
        alt="cherry picture"
      />
      <div id="shade"></div>
      <h2>Cherries</h2>
    </div>
  </body>
</html>
